<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My GitHub Page</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --accent: #c8f135;
      --text: #f0f0f0;
      --muted: #555;
      --border: #1e1e1e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    /* background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 0;
      opacity: 0.6;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      padding: 3rem 3.5rem;
      max-width: 560px;
      width: 100%;
      animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tag::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    h1 span {
      color: var(--accent);
    }

    p {
      font-size: 0.95rem;
      color: #888;
      line-height: 1.7;
      margin-bottom: 2rem;
      font-weight: 400;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .meta-item {
      background: #161616;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1rem 1.2rem;
    }

    .meta-item .label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.3rem;
    }

    .meta-item .value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
    }

    .footer {
      margin-top: 2rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">GitHub Repository</div>
    <h1>Hello,<br><span>World.</span></h1>
    <p>This is my first file on GitHub. Building in public, learning every day.</p>
    <hr class="divider"/>
    <div class="meta">
      <div class="meta-item">
        <div class="label">Status</div>
        <div class="value">Active</div>
      </div>
      <div class="meta-item">
        <div class="label">Type</div>
        <div class="value">HTML File</div>
      </div>
      <div class="meta-item">
        <div class="label">Author</div>
        <div class="value">Me</div>
      </div>
      <div class="meta-item">
        <div class="label">Year</div>
        <div class="value">2026</div>
      </div>
    </div>
    <div class="footer">
      <span>index.html</span>
      <span>v1.0.0</span>
    </div>
  </div>
</body>
</html>
